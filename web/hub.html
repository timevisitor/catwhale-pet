<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>信息中枢</title>
<style>
  :root{
    --bg: rgba(248,249,245,.972);
    --panel: rgba(255,255,252,.72);
    --line: rgba(90,100,92,.16);
    --line2: rgba(90,100,92,.28);
    --text: #566059;
    --muted: #7b847d;
    --accent: #AC7D0C;
    --accent-bg: rgba(246,198,46,.20);
    --danger: #b4453a;
    --ok: #2f7d4f;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; background:transparent; overflow:hidden;
    font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif; color:var(--text); }
  #card{
    height:100%; display:flex; flex-direction:column;
    background:var(--bg); border-radius:14px; border:1px solid rgba(255,255,247,.85);
    box-shadow:0 0 0 1px rgba(90,100,92,.20), 0 18px 44px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.10);
    overflow:hidden;
  }
  /* 头部：可拖动 */
  #head{ display:flex; align-items:center; gap:8px; padding:12px 14px 10px; flex:none;
         -webkit-app-region: drag; border-bottom:1px solid var(--line); }
  #head h1{ font-size:14px; font-weight:600; margin:0; letter-spacing:.4px; }
  #head .sub{ font-size:11px; color:var(--muted); margin-left:2px; flex:1; min-width:0;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #close{ -webkit-app-region:no-drag; width:26px; height:26px; border-radius:8px; border:1px solid transparent;
          background:transparent; color:var(--muted); font-size:16px; line-height:1; cursor:pointer; }
  #close:hover{ background:rgba(0,0,0,.06); color:var(--text); }

  #main{ flex:1; display:flex; min-height:0; }
  /* 左侧页签 */
  #rail{ width:106px; flex:none; padding:8px 6px; display:flex; flex-direction:column; gap:2px;
         border-right:1px solid var(--line); overflow-y:auto; }
  #rail button{ display:flex; align-items:center; gap:7px; width:100%; padding:8px 7px; border-radius:8px;
    border:1px solid transparent; background:transparent; color:var(--text); font-size:12px; cursor:pointer;
    font-family:inherit; text-align:left; white-space:nowrap; }
  #rail button .ic{ font-size:14px; width:16px; text-align:center; flex:none; }
  #rail button:hover{ background:rgba(0,0,0,.045); }
  #rail button.on{ background:var(--accent-bg); border-color:rgba(172,125,12,.28); color:#66521A; font-weight:600; }
  #rail .dot{ margin-left:auto; width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:0; }
  #rail button.hasnew .dot{ opacity:1; }

  /* 右侧内容 */
  #body{ flex:1; min-width:0; overflow-y:auto; padding:12px 14px 16px; }
  .pane{ display:none; }
  .pane.on{ display:block; }
  .sec{ margin-bottom:14px; }
  .sec h2{ font-size:12px; font-weight:600; color:var(--muted); margin:0 0 8px; letter-spacing:.4px;
           display:flex; align-items:center; gap:8px; }
  .sec h2 .grow{ flex:1; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 11px; }
  .row{ display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .row:last-child{ border-bottom:0; }
  .row .t{ flex:1; min-width:0; }
  .row .t .n{ font-size:12.5px; }
  .row .t .m{ font-size:11px; color:var(--muted); margin-top:2px;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .v{ font-size:12px; font-variant-numeric:tabular-nums; }
  .empty{ color:var(--muted); font-size:12px; padding:14px 4px; text-align:center; line-height:1.7; }
  .muted{ color:var(--muted); }
  .warn{ color:var(--danger); }
  .ok{ color:var(--ok); }

  .btn{ font-family:inherit; font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer;
        border:1px solid var(--line2); background:rgba(255,255,255,.7); color:var(--text); }
  .btn:hover{ background:#fff; }
  .btn.primary{ background:var(--accent-bg); border-color:rgba(172,125,12,.32); color:#66521A; font-weight:600; }
  .btn.sm{ padding:3px 8px; font-size:11px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  input[type=text], input[type=number], input[type=password], input[type=time], select, textarea{
    font-family:inherit; font-size:12px; padding:6px 8px; border-radius:8px;
    border:1px solid var(--line2); background:rgba(255,255,255,.86); color:var(--text); outline:none; }
  input:focus, select:focus{ border-color:rgba(172,125,12,.55); box-shadow:0 0 0 3px rgba(246,198,46,.18); }
  .field{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .field label{ font-size:12px; color:var(--muted); width:64px; flex:none; }
  .field input, .field select{ flex:1; min-width:0; }

  /* 开关 */
  .sw{ position:relative; width:34px; height:19px; flex:none; border-radius:99px; background:rgba(90,100,92,.25);
       border:none; cursor:pointer; transition:background .15s; }
  .sw::after{ content:''; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%;
       background:#fff; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .sw.on{ background:rgba(172,125,12,.75); }
  .sw.on::after{ transform:translateX(15px); }

  /* 消息卡 */
  .msg{ padding:8px 0; border-bottom:1px dashed var(--line); }
  .msg:last-child{ border-bottom:0; }
  .msg .h{ display:flex; gap:8px; align-items:baseline; }
  .msg .ttl{ font-size:12.5px; font-weight:600; flex:1; min-width:0;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msg .tm{ font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .msg .bd{ font-size:12px; color:#5f6a62; margin-top:3px; line-height:1.5;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tag{ font-size:10px; padding:1px 6px; border-radius:99px; background:rgba(90,100,92,.12); color:var(--muted); }
  .tag.w{ background:rgba(180,69,58,.13); color:var(--danger); }

  /* 音乐 */
  .track{ font-size:13px; font-weight:600; }
  .track .ar{ font-size:11.5px; color:var(--muted); font-weight:400; margin-top:2px; }
  .seek{ width:100%; margin:10px 0 4px; accent-color:#AC7D0C; }
  .ctrls{ display:flex; gap:8px; justify-content:center; margin-top:8px; }
  .ctrls .btn{ min-width:46px; text-align:center; }

  /* 剪贴板 */
  .clip{ padding:7px 0; border-bottom:1px dashed var(--line); cursor:pointer; }
  .clip:hover{ background:rgba(0,0,0,.03); }
  .clip .x{ font-size:11.5px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2;
            -webkit-box-orient:vertical; overflow:hidden; word-break:break-all; }
  .clip .f{ display:flex; gap:6px; align-items:center; margin-top:4px; font-size:10.5px; color:var(--muted); }
  .clip.pin .x{ color:#66521A; }

  /* 天气 */
  .wnow{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
  .wnow .t{ font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .wdays{ display:flex; gap:6px; margin-top:8px; overflow-x:auto; padding-bottom:2px; }
  .wday{ flex:none; text-align:center; font-size:11px; padding:7px 9px; border-radius:8px;
         background:rgba(255,255,255,.65); border:1px solid var(--line); min-width:52px; }
  .wday b{ display:block; font-size:12px; margin:3px 0; }

  /* 设置 */
  .src{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--line); }
  .src .nm{ flex:1; min-width:0; }
  .src .nm .l{ font-size:12.5px; }
  .src .nm .d{ font-size:10.5px; color:var(--muted); margin-top:2px; }
  #toast{ position:fixed; left:50%; bottom:14px; transform:translate(-50%,8px); opacity:0;
          background:rgba(40,44,42,.92); color:#fff; font-size:11.5px; padding:7px 12px; border-radius:8px;
          transition:opacity .18s, transform .18s; pointer-events:none; max-width:88%; }
  #toast.on{ opacity:1; transform:translate(-50%,0); }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(90,100,92,.22); border-radius:99px; }
</style>
</head>
<body>
<div id="card">
  <div id="head">
    <h1>信息中枢</h1>
    <span class="sub" id="sub">正在读取…</span>
    <button id="close" title="关闭">✕</button>
  </div>
  <div id="main">
    <div id="rail"></div>
    <div id="body"></div>
  </div>
</div>
<div id="toast"></div>
<script src="hub.js"></script>
</body>
</html>
