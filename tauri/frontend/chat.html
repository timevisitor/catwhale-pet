<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>猫鲸 · DeepSeek 聊天</title>
<style>
:root{--sao-font:"Microsoft YaHei UI","Segoe UI",sans-serif;--sao-mono:"Cascadia Mono","Consolas",monospace;--gold:#f6c62e;--gold-deep:#ac7d0c;--text:#49564e;--dim:#839079}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}body{font-family:var(--sao-font)}button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:default;box-shadow:none}[hidden]{display:none!important}
#chat{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:rgba(249,250,246,.985);border:1px solid rgba(114,124,111,.38);border-left:3px solid var(--gold);color:var(--text);box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:2px;overflow:hidden;animation:open .18s cubic-bezier(.2,.8,.2,1)}#chat>*{min-width:0}.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 8px;flex:none}.chat-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;min-width:0}.chat-title svg{width:20px;height:20px;flex:none;color:#9e7b1d}.chat-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-actions{display:flex;align-items:center;gap:6px;flex:none}.chat-actions button{height:26px;padding:0 9px;font-size:12px;background:rgba(255,255,255,.62);border:1px solid rgba(90,100,92,.26);border-radius:2px}#cClose{width:28px;height:28px;padding:0;font-size:20px;line-height:1;background:transparent;border-color:transparent;color:#748075}.chat-actions button:hover{background:#fffdf3;border-color:rgba(246,198,46,.65)}
#cstatus{display:flex;flex:none;align-items:flex-start;justify-content:space-between;gap:8px;width:100%;padding:0 14px 11px;font-size:11px;line-height:1.6;white-space:normal;border-bottom:1px solid rgba(110,122,110,.2)}.connection{display:flex;align-items:center;gap:6px;padding-top:1px;flex:1;min-width:0}.cdot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--dim)}.cdot.idle{background:#3f8f5f}.cdot.running,.cdot.starting{background:var(--gold-deep);animation:pulse 1s infinite}.cdot.dead{background:#b4453f}.connection-details{min-width:0;max-width:74%;text-align:right}.connection-details summary{color:#82734a;cursor:pointer;font-size:11px}.connection-details[open]{flex:1 1 100%;max-width:100%}.connection-details dl{display:grid;grid-template-columns:48px minmax(0,1fr);gap:4px 8px;margin:7px 0 0;padding:8px 10px;background:#eff1ea;text-align:left;max-height:108px;overflow:auto}.connection-details dt{color:#7b857a}.connection-details dd{margin:0;overflow-wrap:anywhere;user-select:text}
#cmsg{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding:16px 14px;overscroll-behavior:contain;scroll-padding:12px;background:rgba(241,243,236,.42)}#cmsg>*{flex-shrink:0;min-width:0}.cline{max-width:100%;padding:11px 13px;font-size:13px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;user-select:text}.assistant{width:100%;background:#fff;border:1px solid #e0e4d9;border-left:2px solid #e7c351}.user{max-width:88%;align-self:flex-end;background:#fff2be;border:1px solid #e8d387;color:#60512b}.assistant::before,.user::before{display:block;margin-bottom:5px;color:#839079;font-size:10px;line-height:1.5;letter-spacing:.3px}.assistant::before{content:'DeepSeek'}.assistant[data-who]::before{content:attr(data-who)}.user::before{content:'你';color:#9b833b}.err{width:100%;font-size:12px;background:rgba(180,69,63,.1);border:1px solid rgba(180,69,63,.45);border-left:3px solid #b4453f;color:#8a3330}#cmsg pre{display:block;max-width:100%;padding:10px;margin:10px 0;white-space:pre;overflow:auto;word-break:normal;background:#f2f4ef;border:1px solid #dce1d5;font:12px/1.65 var(--sao-mono);user-select:text}#cmsg code{font:12px var(--sao-mono);padding:1px 3px;background:#f5edce;color:#786429}.thinking{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:#8a6a10;font-size:11.5px;line-height:1.7}.spinner{width:11px;height:11px;border:2px solid rgba(172,125,12,.25);border-top-color:var(--gold-deep);border-radius:50%;animation:spin .8s linear infinite}.caret{display:inline-block;width:7px;height:13px;margin-left:3px;background:var(--gold-deep);vertical-align:-2px;animation:blink .9s steps(1) infinite}.ctool{width:100%;max-width:100%;padding:9px 10px;overflow-wrap:anywhere;background:rgba(255,255,255,.66);border:1px solid rgba(103,112,106,.24);font:11px/1.6 var(--sao-mono);color:#5d6a62;user-select:text}.ctool.bad{background:rgba(180,69,63,.1);border-color:rgba(180,69,63,.45)}.ctname{color:#8a6a10;font-weight:600}.ctarg{display:block;opacity:.78;word-break:break-all}.ctool details{margin-top:4px}.ctool summary,.creason summary{cursor:pointer}.ctool pre{max-height:150px}.creason{max-width:100%;width:100%;color:var(--dim);font:11px/1.6 var(--sao-mono)}.creason details{padding:6px 8px;border:1px solid rgba(103,112,106,.24);background:rgba(255,255,255,.55)}.creason .reason-text{max-height:160px;overflow:auto;margin-top:5px;white-space:pre-wrap;user-select:text}
.chat-composer{flex:none;padding:11px 14px 10px;border-top:1px solid #dde2d5;background:#f9faf6}#cinput{display:block;width:100%;height:76px;min-height:56px;padding:10px 11px;resize:none;color:var(--text);font:13px/1.6 var(--sao-font);border:1px solid #cfd6c5;border-radius:2px;background:#fff;outline:none;user-select:text}#cinput:focus{border-color:#ccaa39;box-shadow:0 0 0 2px rgba(246,198,46,.14)}#cinput::placeholder{color:#929b8b}.composer-actions{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}.composer-hint{flex:1;color:#939b8e;font-size:10px;line-height:1.5;min-width:130px}#cSend{min-width:68px;padding:7px 14px;background:var(--gold);border:1px solid #d1ab32;color:#5c4b18;border-radius:2px}.sfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;padding:7px 14px;border-top:1px solid #e4e8dd;color:#929b8b;font-size:10px;background:#f5f7ef}.sfoot-actions{display:flex;gap:14px;align-items:center}.clink{font:11px/1.5 var(--sao-font);padding:0;border:0;background:transparent;color:#857044;box-shadow:none}.clink:hover:not(:disabled){text-decoration:underline}
#personaPane{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:rgba(249,250,246,.995)}.phead{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;border-bottom:1px solid rgba(110,122,110,.2)}.phead b{font-size:15px}.phead span{flex:1;color:var(--dim);font-size:11px}.phead button{width:28px;height:28px;padding:0;font-size:20px;background:transparent;border:0}.pbar{display:flex;gap:6px;align-items:center;padding:9px 14px;flex-wrap:wrap}.pbar button{padding:4px 10px;font-size:12px;background:#fff;border:1px solid #d8ddd2;border-radius:2px}.pbar button.primary{background:#fff2be;border-color:#e8d387}.pmsg{padding:0 14px;font-size:11px;min-height:18px;color:var(--dim);overflow-wrap:anywhere}.pmsg.bad{color:#b4453f}.plist{flex:1;min-height:0;overflow:auto;padding:6px 14px;display:flex;flex-direction:column;gap:7px}.prow{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#fff;border:1px solid #e0e4d9}.prow.on{border-left:3px solid #e7c351;background:#fffbea}.pinfo{flex:1;min-width:0}.pname{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pmeta{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prow button{padding:3px 8px;background:#fff8db;border:1px solid #d8c270;border-radius:2px}.pempty{color:var(--dim);font-size:12px;padding:16px 4px;line-height:1.7}
button:focus-visible,summary:focus-visible{outline:2px solid #b49735;outline-offset:2px}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(103,112,106,.35);border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.35}}@keyframes open{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}@media(max-height:440px){.chat-head{padding-top:7px;padding-bottom:3px}#cstatus{padding-bottom:5px}.chat-composer{padding-top:7px;padding-bottom:7px}#cinput{height:56px}.composer-hint{display:none}.composer-actions{justify-content:flex-end}.connection-details dl{max-height:50px}}@media(prefers-reduced-motion:reduce){#chat,#chat *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="chat" role="dialog" aria-label="DeepSeek 聊天">
  <div class="chat-head" data-tauri-drag-region>
    <div class="chat-title" data-tauri-drag-region><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"/></svg><span>DeepSeek 聊天</span></div>
    <div class="chat-actions"><button id="cPersona" type="button" title="切换 / 导入角色卡">角色</button><button id="cClose" type="button" aria-label="关闭聊天" title="关闭聊天（Esc）">×</button></div>
  </div>
  <div id="cstatus"></div>
  <div id="cmsg" role="log" aria-label="聊天记录" aria-live="off" tabindex="0"></div>
  <div class="chat-composer"><textarea id="cinput" rows="3" spellcheck="false" autocomplete="off" aria-label="消息内容" placeholder="说点什么…"></textarea><div class="composer-actions"><span class="composer-hint">Enter 发送 · Shift+Enter 换行 · 走动指令：向左走 / 往右走 200 像素 / 停下</span><button id="cSend" type="button">发送 ↗</button></div></div>
  <div class="sfoot"><span>Esc 关闭窗口</span><div class="sfoot-actions"><button type="button" class="clink" id="cCancel" disabled>停止生成</button><button type="button" class="clink" id="cClear">清空对话</button></div></div>
  <section id="personaPane" hidden aria-label="角色卡">
    <div class="phead"><b>角色卡</b><span>只切换人设，聊天仍由当前后端处理</span><button id="pClose" type="button" aria-label="返回聊天">×</button></div>
    <div class="pbar"><button id="pDefault" type="button" class="primary">默认助手</button><button id="pImport" type="button">导入 PNG / JSON</button><button id="pManage" type="button">管理角色卡</button><input id="pFile" type="file" accept=".png,.json,image/png,application/json" hidden></div>
    <div id="pMsg" class="pmsg">角色历史分别保存；切换后会载入对应对话。</div><div id="pList" class="plist"></div>
  </section>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),T=window.__TAURI__;
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const errText=e=>String(e&&e.message||e||'未知错误');
const failText=(r,f)=>(r&&(r.error||r.detail))||f||'操作失败';
const jsonText=v=>{try{return JSON.stringify(v,null,2);}catch(e){return String(v);}};
const C={msgs:[],current:null,tools:[],reasoning:'',busy:false,state:'',backend:'harness',route:'',usage:null,title:'',persona:'',error:'',started:0,timer:0};
const P={list:[],activeId:'',active:null};
const listeners=[];
window.__chatTest={messages:C.msgs,ready:false,calls:[]};
async function invokeCmd(cmd,args){if(window.__chatTest&&Array.isArray(window.__chatTest.calls))window.__chatTest.calls.push(cmd);try{if(!T||!T.core)return{ok:false,error:'Tauri 通道不可用'};return await T.core.invoke(cmd,args||{});}catch(e){return{ok:false,error:cmd+'：'+errText(e)};}}
async function listen(name,fn){try{if(!T||!T.event)return;const un=await T.event.listen(name,e=>fn(e&&Object.prototype.hasOwnProperty.call(e,'payload')?e.payload:e));if(typeof un==='function')listeners.push(un);}catch(e){console.warn(name,e);}}
function mdLite(text){const parts=String(text==null?'':text).split(/```/);return parts.map((part,i)=>{if(i%2){const body=part.replace(/^[\w+#.-]*\n/,'').replace(/\n$/,'');return'<pre>'+esc(body)+'</pre>';}return esc(part).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|\n)### ([^\n]+)/g,'$1<b>$2</b>').replace(/\n/g,'<br>');}).join('');}
function usageText(u){if(!u||typeof u!=='object')return'';const input=u.inputTokens??u.input_tokens??u.promptTokens??u.prompt_tokens,output=u.outputTokens??u.output_tokens??u.completionTokens??u.completion_tokens??u.totalOutputTokens,total=u.totalTokens??u.total_tokens,bits=[];if(input!=null)bits.push('输入 '+input);if(output!=null)bits.push('输出 '+output);if(total!=null)bits.push('总计 '+total);return bits.length?bits.join(' / ')+' tokens':jsonText(u);}
function stateText(){if(C.backend==='api')return(C.persona?'「'+C.persona+'」 · ':'')+({running:'API 生成中…',idle:'直连 API 就绪',dead:'API 出错'}[C.state]||'直连 API（发消息即请求）');return{starting:'Harness 启动中（首次约 7 秒）…',running:'Harness 正在处理…',idle:'已连接 Harness',dead:'Harness 已停止'}[C.state]||'未连接（发消息即启动）';}
function updatePersonaButton(){$('cPersona').textContent=C.persona||'角色';const title=document.querySelector('.chat-title span');title.textContent=C.persona||(C.backend==='api'?'API 聊天':'DeepSeek 聊天');}
function chatScroll(){const box=$('cmsg'),follow=box.scrollHeight-box.scrollTop-box.clientHeight<60;return{follow,top:box.scrollTop};}
function renderChat(){
  const box=$('cmsg'),scroll=chatScroll(),expanded=[...box.querySelectorAll('details')].map(el=>el.open),statusExpanded=!!$('cstatus').querySelector('details[open]');
  let html=C.msgs.map(m=>{const who=m.role==='assistant'?(m.who||C.persona||''):'';return '<div class="cline '+(m.role==='user'?'user':m.role==='err'?'err':'assistant')+'"'+(who?' data-who="'+esc(who)+'"':'')+'>'+mdLite(m.text||'')+(m.streaming?'<span class="caret"></span>':'')+'</div>';}).join('');
  if(C.reasoning)html+='<div class="creason"><details><summary>思考过程（'+C.reasoning.length+' 字）</summary><div class="reason-text">'+mdLite(C.reasoning)+'</div></details></div>';
  html+=C.tools.map(t=>'<div class="ctool'+(t.isError?' bad':'')+'"><span class="ctname">'+esc(t.done?'完成':'调用中')+' · '+esc(t.name||'工具')+'</span>'+(t.args?'<span class="ctarg">'+esc(t.args)+'</span>':'')+(t.done?'<details><summary>工具返回</summary><pre>'+esc(t.result||'')+'</pre></details>':'')+'</div>').join('');
  if(C.busy){const secs=C.started?Math.round((Date.now()-C.started)/1000):0;html+='<div class="thinking"><span class="spinner"></span>'+(C.state==='starting'?'正在启动 Harness 运行时…':C.backend==='api'?(C.persona||'模型')+' 正在输入… '+secs+' 秒':'Harness 正在处理… '+secs+' 秒')+(secs>25?'（可点下方“停止生成”）':'')+'</div>';}
  if(C.error)html+='<div class="cline err">'+mdLite(C.error)+'</div>';
  if(!html)html='<div class="cline assistant" style="color:var(--dim);background:transparent;border:none">'+(C.backend==='api'?'直连 API 聊天（OpenAI / Anthropic 兼容接口）。':'和 DeepSeek 聊天（走本机 Harness，带工具与记忆能力）。')+(C.persona?'<br>当前角色：'+esc(C.persona):'<br>右上角「角色」可切换 / 导入角色卡。')+'</div>';
  box.innerHTML=html;box.querySelectorAll('details').forEach((el,i)=>el.open=!!expanded[i]);box.scrollTop=scroll.follow?box.scrollHeight:scroll.top;
  $('cSend').disabled=C.busy||!$('cinput').value.trim();$('cCancel').disabled=!C.busy;$('cClear').disabled=C.busy||!C.msgs.length;
  const details=[];if(C.route)details.push('<dt>模型</dt><dd>'+esc(C.route)+'</dd>');if(C.title)details.push('<dt>会话</dt><dd>'+esc(C.title)+'</dd>');const usage=usageText(C.usage);if(usage)details.push('<dt>用量</dt><dd>'+esc(usage)+'</dd>');
  $('cstatus').innerHTML='<span class="connection"><span class="cdot '+esc(C.busy?'running':C.state||'off')+'"></span>'+esc(stateText())+'</span>'+(details.length?'<details class="connection-details"'+(statusExpanded?' open':'')+'><summary>会话详情</summary><dl>'+details.join('')+'</dl></details>':'');updatePersonaButton();
}
function appendMessage(role,text,streaming,who){const m={role,text:String(text||''),at:Date.now(),streaming:!!streaming};if(who)m.who=String(who);C.msgs.push(m);return m;}
function ensureStream(){if(!C.current)C.current=appendMessage('assistant','',true);return C.current;}
async function refreshChat(){const r=await invokeCmd('chat_history');if(!Array.isArray(r)){C.error=failText(r,'读取聊天记录失败');renderChat();return;}const current=C.current;C.msgs.splice(0,C.msgs.length,...r.filter(m=>m&&typeof m==='object'));if(current&&C.busy&&!C.msgs.some(m=>m===current))C.msgs.push(current);C.error='';renderChat();}
async function refreshHarnessStatus(){const st=await invokeCmd('harness_status');if(!st||st.ok===false){C.error=failText(st,'状态读取失败');renderChat();return;}C.backend=st.backend||C.backend;C.state=st.state||(st.busy||st.running?'running':st.ready?'idle':'');C.persona=st.persona&&(st.persona.name||st.persona.id)||C.persona;if(st.backend==='api')C.route=(st.apiProtocol||st.provider||'')+' / '+(st.apiModel||st.model||'未填模型');else if(st.provider||st.model)C.route=(st.provider||'')+' / '+(st.model||'');if(st.busy||st.running||st.state==='running'){if(!C.busy){C.busy=true;C.started=Date.now();startTimer();}}else if(st.state==='idle'&&!C.current)C.busy=false;renderChat();}
function startTimer(){clearInterval(C.timer);C.timer=setInterval(()=>{if(C.busy)renderChat();},1000);}
/* 本地走动指令：只解析用户本次输入，不经过 API / Harness，也不监听 AI 输出或历史。
   命中后由 Rust 权威移动桌宠，这里只显示本地反馈。 */
async function runWalkCommand(text){const r=await invokeCmd('walk_command',{text});if(!r||r.matched!==true)return false;appendMessage('user',text,false);if(r.ok===false){appendMessage('err','走动：'+failText(r,'执行失败'),false);}else{appendMessage('assistant','（桌宠）'+(r.reply||'好。'),false,'桌宠');}return true;}
if(window.__chatTest)window.__chatTest.walk=runWalkCommand;
async function sendChat(){const text=$('cinput').value.trim();if(!text||C.busy)return;if(await runWalkCommand(text)){$('cinput').value='';renderChat();return;}C.busy=true;C.started=Date.now();C.error='';C.reasoning='';C.tools=[];C.usage=null;C.title='';C.current=null;appendMessage('user',text,false);$('cinput').value='';startTimer();renderChat();const r=await invokeCmd('harness_chat',{prompt:text,history:[]});if(!r||r.ok===false){C.busy=false;clearInterval(C.timer);C.error='发送失败：'+failText(r,'未知错误');if(C.current){C.current.streaming=false;C.current=null;}renderChat();return;}if(!r.streaming){C.busy=false;clearInterval(C.timer);if(C.current){C.current.streaming=false;C.current=null;}await refreshChat();}else renderChat();}
async function cancelChat(){if(!C.busy)return;const r=await invokeCmd('harness_cancel');C.busy=false;clearInterval(C.timer);if(C.current){C.current.streaming=false;C.current=null;}C.reasoning='';C.tools=[];C.error=r&&r.ok?'已取消这次请求。':'取消：'+failText(r,'已请求停止');renderChat();}
async function clearChat(){if(C.busy)return;const r=await invokeCmd('chat_clear');if(!r||r.ok===false)C.error=failText(r,'清空失败');else{C.msgs.splice(0);C.current=null;C.tools=[];C.reasoning='';C.usage=null;C.title='';C.error='';}renderChat();}
function onHarnessEvent(evt){if(!evt||typeof evt!=='object')return;switch(evt.kind){case'delta':C.busy=true;ensureStream().text+=String(evt.text||'');break;case'reasoning':C.reasoning+=String(evt.text||'');break;case'message':if(evt.text)ensureStream().text=String(evt.text);if(evt.usage)C.usage=evt.usage;break;case'toolCall':C.tools.push({name:String(evt.name||'工具'),callId:evt.callId,args:typeof evt.args==='string'?evt.args:jsonText(evt.args),done:false,result:'',isError:false});break;case'toolResult':{let t=null;const id=evt.callId;t=[...C.tools].reverse().find(x=>!x.done&&(id==null||String(x.callId)===String(id)))||[...C.tools].reverse().find(x=>!x.done);if(!t){t={name:'工具',callId:id,args:'',done:false};C.tools.push(t);}t.done=true;t.result=String(evt.text||'');t.isError=!!evt.isError;break;}case'usage':C.usage=evt.usage||evt;break;case'route':C.route=(evt.provider||'')+' / '+(evt.model||'');break;case'title':C.title=String(evt.title||'');break;case'turnStart':C.busy=true;if(!C.started)C.started=Date.now();startTimer();break;case'turnEnd':{const reason=evt.reason||{},kind=typeof reason==='string'?reason:reason.kind;C.busy=false;clearInterval(C.timer);if(C.current){C.current.streaming=false;C.current=null;}if(kind==='error')C.error=(C.backend==='api'?'API 出错：':'Harness 出错：')+((reason.error&&reason.error.message)||reason.message||evt.error||'未知错误');else if(kind==='cancelled')C.error='这次生成已取消。';else C.error='';C.reasoning='';C.tools=[];setTimeout(refreshChat,120);break;}}renderChat();}
function onHarnessStatus(st){if(!st)return;C.state=st.state||C.state;if(st.info&&st.info.provider)C.route=st.info.provider+' / '+(st.info.model||'');if(st.state==='running'){C.busy=true;if(!C.started)C.started=Date.now();startTimer();}else if(st.state==='idle'){if(!C.current){C.busy=false;clearInterval(C.timer);}}else if(st.state==='dead'){C.busy=false;clearInterval(C.timer);if(C.current){C.current.streaming=false;C.current=null;}C.error='Harness 已停止：'+((st.info&&st.info.reason)||st.dead||'下次发消息会自动重启');}renderChat();}
function closeFloat(){invokeCmd('close_float',{label:'chat'});}
function applyPersona(r){if(!r||r.ok===false)return false;if(Array.isArray(r.list))P.list=r.list;if('activeId'in r){P.activeId=r.activeId||'';P.active=r.active||null;}C.persona=P.active&&P.active.name||'';updatePersonaButton();return true;}
function renderPersonas(){const box=$('pList');if(!P.list.length){box.innerHTML='<div class="pempty">还没有角色卡。可导入 V1 / V2 / V3 JSON 或 SillyTavern PNG，也可以打开管理页面新建。</div>';return;}box.innerHTML=P.list.map(it=>'<div class="prow'+(it.id===P.activeId?' on':'')+'"><div class="pinfo"><div class="pname">'+esc(it.name||it.id)+'</div><div class="pmeta">'+esc(it.broken||it.id)+'</div></div>'+(it.broken?'':'<button type="button" data-use="'+esc(it.id)+'">'+(it.id===P.activeId?'使用中':'使用')+'</button>')+'</div>').join('');}
async function refreshPersonas(){const r=await invokeCmd('persona_list');if(!applyPersona(r)){$('pMsg').textContent=failText(r,'角色列表读取失败');$('pMsg').className='pmsg bad';return;}renderPersonas();renderChat();}
async function usePersona(id){const r=await invokeCmd('persona_set_active',{id:id||null});if(!applyPersona(r)){$('pMsg').textContent=failText(r,'切换失败');$('pMsg').className='pmsg bad';return;}C.current=null;C.tools=[];C.reasoning='';renderPersonas();await refreshChat();await refreshHarnessStatus();$('pMsg').textContent=id?'已切换角色，并载入该角色的聊天记录。':'已回到默认助手。';$('pMsg').className='pmsg';}
async function importPersona(file){if(!file)return;if(file.size>8*1024*1024){$('pMsg').textContent='文件过大（上限 8MB）';return;}try{const bytes=Array.from(new Uint8Array(await file.arrayBuffer()));const r=await invokeCmd('persona_import_buffer',{data:bytes});if(!applyPersona(r)){$('pMsg').textContent=failText(r,'导入失败');return;}renderPersonas();$('pMsg').textContent='已导入 '+file.name+'；点击“使用”切换。';}catch(e){$('pMsg').textContent='读取文件失败：'+errText(e);}}
$('cinput').addEventListener('input',renderChat);$('cinput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});$('cSend').addEventListener('click',sendChat);$('cCancel').addEventListener('click',cancelChat);$('cClear').addEventListener('click',clearChat);$('cClose').addEventListener('click',closeFloat);
$('cPersona').addEventListener('click',()=>{$('personaPane').hidden=false;refreshPersonas();});$('pClose').addEventListener('click',()=>{$('personaPane').hidden=true;$('cinput').focus();});$('pDefault').addEventListener('click',()=>usePersona(''));$('pManage').addEventListener('click',()=>invokeCmd('open_panel',{panel:'persona'}));$('pImport').addEventListener('click',()=>$('pFile').click());$('pFile').addEventListener('change',async()=>{await importPersona($('pFile').files[0]);$('pFile').value='';});$('pList').addEventListener('click',e=>{const b=e.target.closest('[data-use]');if(b)usePersona(b.dataset.use);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(!$('personaPane').hidden){$('personaPane').hidden=true;$('cinput').focus();}else closeFloat();}});
listen('harness:event',onHarnessEvent);listen('harness:status',onHarnessStatus);listen('float:show',label=>{if(label&&label!=='chat')return;setTimeout(()=>{$('cinput').focus();refreshPersonas();refreshChat();refreshHarnessStatus();},40);});
window.addEventListener('beforeunload',()=>{clearInterval(C.timer);for(const un of listeners){try{un();}catch(e){}}});
/* 预热窗（Rust 以 chat.html?prewarm=1 预建、保持隐藏）：只画静态骨架，
   角色/历史/Harness 状态与输入框焦点留给真正显示时的 float:show 再补，
   避免一个从没打开过的聊天窗在后台读文件、抢焦点。 */
if(new URLSearchParams(location.search).get('prewarm')==='1'){window.__chatTest.ready=true;}
else{refreshPersonas();refreshChat();refreshHarnessStatus();setTimeout(()=>{$('cinput').focus();window.__chatTest.ready=true;},50);}
})();
</script>
</body>
