[package]
name = "catwhale-poc"
version = "0.8.1"
edition = "2021"
description = "Catwhale desktop pet (Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
csv = "1"
sysinfo = "0.30"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
crc32fast = "1"
flate2 = "1"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
